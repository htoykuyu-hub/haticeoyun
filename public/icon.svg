<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#facc15" stroke-width="12"/>

  <!-- Question Block (Top Right) -->
  <g transform="translate(330, 70)">
    <rect width="110" height="110" rx="16" fill="url(#block)" stroke="#000" stroke-width="6"/>
    <circle cx="16" cy="16" r="6" fill="#78350f"/>
    <circle cx="94" cy="16" r="6" fill="#78350f"/>
    <circle cx="16" cy="94" r="6" fill="#78350f"/>
    <circle cx="94" cy="94" r="6" fill="#78350f"/>
    <text x="55" y="76" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" stroke="#000" stroke-width="3">?</text>
  </g>

  <!-- Mario Cat Character (Center) -->
  <g transform="translate(256, 320)">
    <!-- Body / Overalls -->
    <rect x="-70" y="30" width="140" height="90" rx="24" fill="#2563eb" stroke="#000" stroke-width="8"/>
    <!-- Yellow buttons -->
    <circle cx="-35" cy="55" r="10" fill="#facc15" stroke="#000" stroke-width="4"/>
    <circle cx="35" cy="55" r="10" fill="#facc15" stroke="#000" stroke-width="4"/>
    <!-- Red sleeves -->
    <circle cx="-75" cy="55" r="24" fill="#dc2626" stroke="#000" stroke-width="6"/>
    <circle cx="75" cy="55" r="24" fill="#dc2626" stroke="#000" stroke-width="6"/>
    <!-- White paws -->
    <circle cx="-85" cy="75" r="18" fill="#ffffff" stroke="#000" stroke-width="6"/>
    <circle cx="85" cy="75" r="18" fill="#ffffff" stroke="#000" stroke-width="6"/>

    <!-- Tail -->
    <path d="M -70 80 Q -120 70 -110 30" fill="none" stroke="#b45309" stroke-width="26" stroke-linecap="round"/>
    <path d="M -110 30 Q -105 20 -100 15" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="95" fill="#f97316" stroke="#000" stroke-width="8"/>
    <!-- White muzzle -->
    <ellipse cx="0" cy="-5" rx="55" ry="38" fill="#ffffff"/>
    <polygon points="0,-18 16,-4 -16,-4" fill="#f43f5e"/>

    <!-- Eyes -->
    <ellipse cx="-32" cy="-42" rx="14" ry="22" fill="#000000"/>
    <circle cx="-28" cy="-48" r="6" fill="#ffffff"/>
    <ellipse cx="32" cy="-42" rx="14" ry="22" fill="#000000"/>
    <circle cx="36" cy="-48" r="6" fill="#ffffff"/>

    <!-- Whiskers -->
    <line x1="35" y1="-8" x2="85" y2="-18" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="5" x2="88" y2="8" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="-8" x2="-85" y2="-18" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <line x1="-35" y1="5" x2="-88" y2="8" stroke="#000" stroke-width="6" stroke-linecap="round"/>

    <!-- Cat Ears -->
    <polygon points="-80,-90 -45,-155 -15,-100" fill="#ea580c" stroke="#000" stroke-width="7"/>
    <polygon points="-65,-95 -45,-140 -25,-100" fill="#fbcfe8"/>
    <polygon points="15,-100 45,-155 80,-90" fill="#ea580c" stroke="#000" stroke-width="7"/>
    <polygon points="25,-100 45,-140 65,-95" fill="#fbcfe8"/>

    <!-- Mario Red Cap -->
    <ellipse cx="0" cy="-90" rx="85" ry="46" fill="url(#cap)" stroke="#000" stroke-width="8"/>
    <ellipse cx="0" cy="-68" rx="70" ry="20" fill="#b91c1c"/>
    <!-- White M Badge -->
    <circle cx="0" cy="-94" r="25" fill="#ffffff" stroke="#000" stroke-width="5"/>
    <text x="0" y="-83" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#dc2626" text-anchor="middle">M</text>
  </g>

  <!-- Multiplication Badge (Bottom Left) -->
  <g transform="translate(60, 360)">
    <circle cx="45" cy="45" r="42" fill="#22c55e" stroke="#ffffff" stroke-width="6"/>
    <text x="45" y="60" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">×</text>
  </g>
</svg>
